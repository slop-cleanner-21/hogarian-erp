<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="ARISANT">
  <rect width="240" height="160" fill="#ffffff"/>
  <!-- Marca: una «A» de techo a dos aguas con ventanas por travesaño, y una franja que sube a la derecha. -->
  <g transform="translate(120 12)">
    <path d="M-58 92 L0 8 L58 92" fill="none" stroke="#0f5f57" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
    <g fill="#0f5f57">
      <rect x="-21" y="50" width="17" height="17"/>
      <rect x="4" y="50" width="17" height="17"/>
      <rect x="-21" y="73" width="17" height="19"/>
      <rect x="4" y="73" width="17" height="19"/>
    </g>
    <path d="M30 34 L50 6 L70 34" fill="none" stroke="#d08b2c" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>
  <text x="120" y="142" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="5" fill="#0f5f57">ARISANT</text>
</svg>
